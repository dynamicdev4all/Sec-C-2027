<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
<h1>Register Page</h1>
<form action="RegisterServlet" method="post">

	<label>First Name : </label>
	<input type="text" placeholder="Email Address" name="firstName" required="required">
	<br>
	<label>Last Name : </label>
	<input type="text" placeholder="Email Address" name="lastName" required="required">
	<br>
	<label>Phone No : </label>
	<input type="text" placeholder="Email Address" name="phone" required="required">
	<br>
	<label>Email Address : </label>
	<input type="email" placeholder="Email Address" name="email" required="required">
	<br>
	<label>Password : </label>
	<input type="password" placeholder="Password" name="password" required="required">
	<br>
	<button type="submit">Register Now</button>
</form>
</body>
</html>
